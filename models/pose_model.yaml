# Static contract matched to the user's Pi HEF inspection and the pinned
# Model Zoo preprocessing/postprocessing sources. NOT inference/accuracy tested.
verified_for_hef: true
verification:
  basis: user_supplied_pi_hef_metadata_and_source_review
  inference_validated: false
  performance_validated: false
model:
  name: yolov8m_pose
  hardware: hailo8
  hailort_version: 4.23.0
  model_zoo_version: v2.18.0
  source_commit: dc402c7ae70149c516324ef9ddff32d27609ae06
  hef_url: https://hailo-model-zoo.s3.eu-west-2.amazonaws.com/ModelZoo/Compiled/v2.18.0/hailo8/yolov8m_pose.hef
  # User-supplied measured SHA256, not a publisher-provided checksum.
  sha256: 54f22e23ee5e161e3b5d8507add82035122f72fa6357b453eb8773c63c0eb4b7
  input_name: yolov8m_pose/input_layer1
  input_format: NHWC
  input_zero_point: 0.0
  embedded_nms: false
input_shape: [640, 640, 3]
preprocess:
  channel_order: rgb
  pad_value: 114
  # Network already divides by 255; feed unscaled quantized UINT8 pixels.
  input_dtype: uint8
  input_quantized: true
  input_scale: 1.0
  input_offset: 0.0
decoder:
  type: yolov8_pose_raw
  reg_max: 16
  scores: probabilities
  keypoint_scores: logits
  person_score_threshold: 0.001
  nms_iou_threshold: 0.7
  max_detections: 300
  missing_joints: none
  heads:
    - stride: 32
      boxes: yolov8m_pose/conv90
      scores: yolov8m_pose/conv91
      keypoints: yolov8m_pose/conv92
    - stride: 16
      boxes: yolov8m_pose/conv75
      scores: yolov8m_pose/conv76
      keypoints: yolov8m_pose/conv77
    - stride: 8
      boxes: yolov8m_pose/conv59
      scores: yolov8m_pose/conv60
      keypoints: yolov8m_pose/conv61
