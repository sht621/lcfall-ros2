# Not executed. Populate .env only during the explicitly authorized Pi stage.
services:
  edge:
    image: fall-detection-edge:jazzy-arm64
    platform: linux/arm64
    build:
      context: .
      args:
        EDGE_ROS_BASE_IMAGE: ${EDGE_ROS_BASE_IMAGE:-ros:jazzy-ros-base}
        WITH_EDGERM: ${WITH_EDGERM:-OFF}
        LIBREALSENSE_REF: ${LIBREALSENSE_REF:?Set exact librealsense revision}
        REALSENSE_ROS_REF: ${REALSENSE_ROS_REF:?Set exact Jazzy realsense-ros revision}
        LIVOX_SDK2_REF: ${LIVOX_SDK2_REF:?Set exact SDK2 revision}
        LIVOX_DRIVER_REF: ${LIVOX_DRIVER_REF:?Set exact ROS2 driver revision}
        HAILORT_DEB: ${HAILORT_DEB:?Set ARM64 runtime deb basename from artifacts/}
        HAILORT_WHEEL: ${HAILORT_WHEEL:?Set matching cp312 ARM64 wheel basename from artifacts/}
        BUILD_JOBS: ${BUILD_JOBS:-2}
    network_mode: host
    init: true
    stop_grace_period: 5s
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=512m
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: '0'
      PYTHONPATH: /models
      LIVOX_CONFIG_PATH: /opt/edge-config/MID360_config.json
    devices:
      - ${HAILO_DEVICE:-/dev/hailo0}:/dev/hailo0
      # Pin to D455's actual USB bus/device; re-evaluate after reconnect.
      - ${REALSENSE_USB_DEVICE:?Set actual /dev/bus/usb/BBB/DDD path}:${REALSENSE_USB_DEVICE}
    group_add:
      - ${HAILO_GID:?Set numeric group owning Hailo device}
      - ${USB_GID:?Set numeric group permitting D455 USB access}
    volumes:
      - ./models:/models:ro
      - ./src/fall_detection_edge/config:/opt/edge-params:ro
      - ./config/livox/MID360_config.json:/opt/edge-config/MID360_config.json:ro
    command:
      - ros2
      - launch
      - fall_detection_edge
      - edge.launch.py
      - params_file:=/opt/edge-params/edge.yaml
      - mount_file:=/opt/edge-params/mount.yaml
      - enable_bridge:=${ENABLE_BRIDGE:-true}
      - publish_mount_tf:=${PUBLISH_MOUNT_TF:-true}
    # No automatic restart, privileged mode, GPU runtime, raw RGB server stream,
    # or persistent application logs. View attached console during Pi operation.
    logging:
      driver: none
